---

- name: Include variables
  include_vars:
    file: docker-images.yml
    name: docker_images

- name: Run tuulikartta processor cron job every minute
  ansible.builtin.cron:
    name: "Tuulikartta data processor"
    minute: "*"
    job: "/usr/bin/docker rm tuulikartta-processor && /usr/bin/docker run --name tuulikartta-processor -v /data/processed:/data/processed {{ docker_images.tuulikartta_processor.image }}:{{ docker_images.tuulikartta_processor.tag }}"
    user: runner
    cron_file: tuulikartta-processor