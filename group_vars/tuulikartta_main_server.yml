---
# Postgres settings for the main server.
# Replace placeholders before running. Encrypt the password with:
#   ansible-vault encrypt_string --prompt --name postgres_password
postgres_user: tuulikartta
postgres_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  66366462343666326339356436363239636536613236373532636437366363373539353063623436
  3164333863306633643139383263636566343930663633310a323737303361386337633361373332
  30663465366632303936323936353837353362336263393337666166623332366264303830396531
  6231383437363066350a663561343965623933643439316136316631366439323638663130653566
  36383839663565633066343935626538396234353938613164326639633866643766333232303463
  3331386330366565396436643530626663656133333165626231
postgres_db: tuulikartta

# Used by the app container and the migration container. Containers reach
# postgres by name over the tuulikartta docker network.
database_url: "postgresql://{{ postgres_user | urlencode }}:{{ postgres_password | string | urlencode | replace('/', '%2F') }}@postgres:5432/{{ postgres_db }}"
