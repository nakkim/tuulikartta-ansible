---

- name: Include certbot variables
  include_vars:
    file: certbot.yml

# - name: Ensure /var/www/certbot exists (webroot for ACME challenges)
#   ansible.builtin.file:
#     path: /var/www/certbot
#     state: directory
#     mode: "0755"

- name: Deploy HTTP-only nginx config (bootstrap, no cert required)
  ansible.builtin.template:
    src: templates/nginx-tuulikartta-http.conf.j2
    dest: /etc/nginx/conf.d/tuulikartta.conf
    mode: "0644"

- name: Remove default nginx server block if present
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Enable and start nginx (HTTP only)
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

