---

- name: Add data directory for tuulikartta
  ansible.builtin.file:
    path: /data/processed
    state: directory
    owner: runner
    group: runner
    mode: '0755'

- name: Add logs directory nginx
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    owner: runner
    group: runner
    mode: '0755'