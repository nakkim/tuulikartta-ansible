---

- name: Include certbot variables
  include_vars:
    file: certbot.yml

- name: Install nginx and certbot
  ansible.builtin.dnf:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Ensure /var/www/certbot exists (webroot for ACME challenges)
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    mode: "0755"

- name: Deploy minimal HTTP-only nginx config (needed before cert exists)
  ansible.builtin.template:
    src: templates/nginx-tuulikartta.conf.j2
    dest: /etc/nginx/conf.d/tuulikartta.conf
    mode: "0644"
  notify: Reload nginx

- name: Remove default nginx server block if present
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Check whether certificate already exists
  ansible.builtin.stat:
    path: "{{ letsencrypt_live_dir }}/fullchain.pem"
  register: cert_stat

- name: Obtain initial certificate via nginx plugin
  ansible.builtin.command:
    cmd: >
      certbot --nginx
      --email {{ certbot_email }}
      --agree-tos
      --no-eff-email
      --redirect
      {% for d in all_domains %} -d {{ d }} {% endfor %}
  when: not cert_stat.stat.exists
  register: certbot_initial
  changed_when: not cert_stat.stat.exists

- name: Reload nginx to apply certbot-updated config
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  # when: not cert_stat.stat.exists

- name: Install renewal cron job (certbot renew handles nginx gracefully)
  ansible.builtin.cron:
    name: "Renew Let's Encrypt cert for {{ domain_name }}"
    minute: "{{ renew_cron_minute }}"
    hour: "{{ renew_cron_hour }}"
    user: root
    job: "certbot renew --quiet && systemctl reload nginx"
    cron_file: certbot-renew
    