---
# Release of tuulikartta-geoserver (the repo's VERSION file). Selects the
# radar-poller and geoserver-init images published to ghcr.io by its CI.
geoserver_version: "1.0.3"

# The repo checkout is still needed for proxy/nginx.conf and the initial
# GeoServer data dir. Pin the commit the images above were built from.
geoserver_repo: "https://github.com/nakkim/tuulikartta-geoserver.git"
geoserver_repo_version: "a6e19303e6cf7c3a9e0df246da2c27a55d8fbb69"

geoserver_src_dir: /opt/tuulikartta-geoserver
# GeoServer data dir. Seeded from the repo's geoserver_data/ on first deploy,
# then owned by GeoServer (existing files are never overwritten).
geoserver_data_dir: /data/geoserver/data_dir
# Radar GeoTIFFs and the ImageMosaic config files
geoserver_mosaic_dir: /data/dbz/geotiff

# User the GeoServer process runs as inside the container (kartoza default 2000).
# GeoServer writes the mosaic config into geoserver_mosaic_dir, so it owns that dir.
geoserver_uid: 2000
geoserver_gid: 2000

# GeoServer admin port (web UI, REST API). Port 8080 is taken by tuulikartta-server.
# Reach it with an SSH tunnel: ssh -L 8081:127.0.0.1:8081 <server>
geoserver_admin_bind: "127.0.0.1:8081"
# nginx proxy exposing only WMS and WMTS (GET/HEAD)
geoserver_proxy_bind: "127.0.0.1:8088"
geoserver_disable_web_interface: true
# Public base URL used in GetCapabilities and other links. Empty leaves it unset.
geoserver_proxy_base_url: "https://tuulikartta.info/geoserver"

# Granule index database in the shared postgres container
geoserver_db_name: radar
geoserver_db_user: radar

radar_poll_interval_seconds: 10
radar_retention_hours: 100
