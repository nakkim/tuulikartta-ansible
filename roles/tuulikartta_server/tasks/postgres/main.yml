---
- name: Include docker image variables
  include_vars:
    file: docker-images.yml
    name: docker_images

- name: Check required postgres variables
  ansible.builtin.assert:
    that:
      - postgres_user is defined
      - postgres_password is defined
      - postgres_db is defined
      - "'CHANGE_ME' not in [postgres_user, postgres_password, postgres_db]"
    fail_msg: "Set postgres_user, postgres_password and postgres_db in group_vars/tuulikartta_main_server.yml"

- name: Create tuulikartta docker network
  community.docker.docker_network:
    name: tuulikartta

- name: Create postgres data volume
  community.docker.docker_volume:
    name: postgres-data

- name: Run postgres docker container
  community.docker.docker_container:
    name: postgres
    image: "{{ docker_images.postgres.image }}:{{ docker_images.postgres.tag }}"
    state: started
    pull: true
    restart_policy: unless-stopped
    env:
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB: "{{ postgres_db }}"
    networks:
      - name: tuulikartta
    # Published on localhost only, so host tools (e.g. `npx prisma migrate`) can reach it
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    detach: true
  no_log: "{{ hide_secrets | default(true) }}"

- name: Wait for postgres to accept connections
  community.docker.docker_container_exec:
    container: postgres
    command: "pg_isready -U {{ postgres_user }} -d {{ postgres_db }}"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

# Runs `prisma migrate deploy` from the same image tag as the deployed app,
# so the schema always matches the code. Applies only pending migrations.
# Never run `prisma db seed` here: seed.sql truncates the notifications table.
- name: Apply database migrations
  community.docker.docker_container:
    name: tuulikartta-migrate
    image: "{{ docker_images.tuulikartta_server.image }}:{{ docker_images.tuulikartta_server.tag }}"
    command: npx prisma migrate deploy
    env:
      DATABASE_URL: "{{ database_url }}"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    networks:
      - name: tuulikartta
    state: started
    recreate: true
    detach: false
    cleanup: true
  register: migrate
  changed_when: "'No pending migrations' not in (migrate.container.Output | default(''))"
  failed_when: false
  # Hides DATABASE_URL, which contains the password
  no_log: "{{ hide_secrets | default(true) }}"

- name: Show migration output
  ansible.builtin.debug:
    msg: "{{ (migrate.container.Output | default('')).splitlines() }}"

- name: Fail if migrations failed
  ansible.builtin.fail:
    msg: "prisma migrate deploy failed (exit code {{ migrate.status | default('unknown') }}), see output above"
  when: migrate.status | default(1) != 0
